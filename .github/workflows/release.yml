name: Release

# Unsigned release builds (spec sections 2, 13 M7 and 14.7). See docs/releasing.md.
#
# - Tag push vX.Y.Z: verify the tag matches the app version, build Windows and
#   macOS (Linux best-effort), checksum everything and create a DRAFT release.
#   A maintainer reviews and publishes the draft by hand.
# - workflow_dispatch, or a PR that changes the release tooling: the same
#   build and packaging as a dry run. Nothing is published; the files are
#   uploaded as workflow artifacts.
#
# Supply chain: no third-party actions. Only GitHub's own actions, pinned to
# commit SHAs; Rust comes from the runner's preinstalled rustup and the Tauri
# CLI from package-lock.json. No build cache, so a poisoned cache from another
# ref cannot reach a release. The only secret is GITHUB_TOKEN, and only the
# publish job (which builds nothing and runs no project code) can write.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release-notes.md
      - tools/bump-version.mjs

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check version fields (and the tag, on a tag push)
        id: check
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          node tools/bump-version.mjs --check $TAG
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    # Windows and macOS are required. Linux is best-effort (spec section 2).
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            rust-targets: ""
            tauri-args: --bundles nsis,msi
            bundle-dir: src-tauri/target/release/bundle
            experimental: false
          - name: macos
            os: macos-latest
            # One universal .dmg for Apple silicon and Intel.
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin --bundles dmg
            bundle-dir: src-tauri/target/universal-apple-darwin/release/bundle
            experimental: false
          - name: linux
            os: ubuntu-latest
            rust-targets: ""
            tauri-args: --bundles deb,appimage
            bundle-dir: src-tauri/target/release/bundle
            experimental: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Rust (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          for t in ${{ matrix.rust-targets }}; do rustup target add "$t"; done
          rustc --version

      - name: Install npm dependencies
        run: npm ci

      - name: Tauri build (unsigned)
        env:
          # linuxdeploy (AppImage) is itself an AppImage; runners lack FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri build -- ${{ matrix.tauri-args }}

      # Release asset names: no spaces (GitHub would turn them into dots).
      - name: Collect installers
        shell: bash
        env:
          BUNDLE_DIR: ${{ matrix.bundle-dir }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p out
          shopt -s nullglob
          for f in "$BUNDLE_DIR"/nsis/*.exe "$BUNDLE_DIR"/msi/*.msi "$BUNDLE_DIR"/dmg/*.dmg \
                   "$BUNDLE_DIR"/deb/*.deb "$BUNDLE_DIR"/appimage/*.AppImage; do
            name=$(basename "$f")
            cp "$f" "out/${name// /-}"
          done
          ls -l out
          count=$(ls out | wc -l)
          if [ "$count" -eq 0 ]; then echo "::error::no installers found in $BUNDLE_DIR"; exit 1; fi
          for f in out/*; do
            case "$f" in *"_${VERSION}_"*) ;; *) echo "::error::$f does not carry version $VERSION"; exit 1 ;; esac
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  package:
    name: checksums and notes
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          path: release
          merge-multiple: true

      - name: Require the Windows and macOS installers
        working-directory: release
        run: |
          ls -l
          ls *.exe *.msi *.dmg > /dev/null

      - name: Write SHA256SUMS.txt
        working-directory: release
        run: |
          # The glob expands before the file exists, so it does not list itself.
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Render release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tag="v$VERSION"
          sed -e "s|{{VERSION}}|$VERSION|g" -e "s|{{TAG}}|$tag|g" -e "s|{{REPOSITORY}}|$REPOSITORY|g" \
            .github/release-notes.md > notes.md
          if grep -q '{{' notes.md; then echo "::error::unreplaced placeholder in notes"; exit 1; fi
          cat notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-draft
          path: |
            release/*
            notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: draft GitHub release
    needs: [version, package]
    # Only a real tag push publishes; dry runs stop at the artifacts above.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-draft
          path: draft

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd draft
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run: refresh the files of the existing draft, never a published release.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::release $TAG is already published; not touching it"; exit 1
            fi
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --draft --verify-tag \
              --title "AIchemist Desktop Buddy $VERSION" \
              --notes-file notes.md --generate-notes
          fi
