[package]
name = "aichemist-desktop-buddy"
version = "0.1.0"
description = "A small desktop companion that reminds you of meetings and tasks"
authors = ["Anders Bo Rasmussen"]
license = "MIT"
repository = "https://github.com/Anras573/AIchemist-desktop-buddy"
edition = "2021"
rust-version = "1.90"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "aichemist_desktop_buddy_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = ["macos-private-api", "tray-icon"] }
# Already in the tree via tauri / tauri-utils; listed so domain types can use them.
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# Already in the lockfile (via serde_with); no default features: no oldtime,
# no wasm-bindgen. `clock` is needed for Local time zone conversion.
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
# SQLite for the event cache, tasks and reminder ledger (spec 3). `bundled`
# compiles SQLite into the binary, so Windows/macOS need no system library and
# every platform gets the same, recent SQLite (STRICT tables). Default features
# off: `cache` (statement cache, pulls in hashlink) and the wasm FFI are unused.
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
# Already in the tree via tauri; the settings file is JSON (spec 3, 8).
serde_json = "1"
# Already in the tree via tauri (the logging facade only, no logger). Used to
# warn about an unreadable or invalid settings file.
log = "0.4"
# A second launch exits instead of showing a second buddy (spec 4). Official
# plugin. On Windows and macOS it adds no crates beyond a proc-macro
# (tracing-attributes): windows-sys, tokio and tracing are already in the tree
# via tauri. At runtime it is a named mutex plus a hidden message window
# (Windows) or a Unix socket listener on the existing async runtime (macOS).
# zbus is pulled in only on Linux.
tauri-plugin-single-instance = "2"
# Microsoft Graph OAuth (src/graph). ureq is a small blocking HTTP client (no
# async runtime, no hyper); the providers are synchronous (domain/provider.rs).
# TLS goes through the OS (SChannel on Windows, Security.framework on macOS)
# with the OS root store: no bundled ring/rustls/webpki roots, and corporate
# TLS-inspecting proxies whose CA is in the OS store keep working. No gzip.
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
# Already in the tree via tauri. OS randomness for the PKCE verifier and `state`.
getrandom = "0.3"
# Same version tauri-codegen already builds. SHA-256 for the PKCE S256 challenge.
sha2 = { version = "0.11", default-features = false }
# Already in the tree via tauri-utils (plist). base64url for PKCE and id_token.
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
# Already in the tree via url. Encodes the authorize URL query and parses the
# loopback redirect query.
form_urlencoded = "1"

# CalDAV (src/caldav) shares the ureq and base64 entries above (Basic auth).
# Already in the tree via tauri-utils (plist): namespace-aware XML reader for
# WebDAV multistatus responses.
quick-xml = "0.42"
# Already in the tree via tauri: href/redirect resolution.
url = "2.5"
# Already in the tree via url: decoding calendar names from paths.
percent-encoding = "2"

# Click-through (src/click_through.rs). Same versions tauri/tao already use,
# so these add no new crates, only a few extra API features.
[target.'cfg(windows)'.dependencies]
# Buddy window (src/buddy_window.rs): window subclass and extended styles.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# OS keychain (src/secrets). keyring v4 is split into `keyring-core` (the API)
# plus one crate per platform store; the `keyring` crate itself is only a
# convenience bundle whose defaults pull in zbus on Linux. We link the core and
# only the native store. Default `search` feature off (it pulls in regex).
keyring-core = "1"
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Screen-change notification (src/buddy_window.rs). Already in the tree via
# objc2-app-kit and tao.
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSString",
] }
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  # "Already running" notice (src/already_running.rs).
  "NSAlert",
  "NSApplication",
  "NSEvent",
  "NSResponder",
  "NSTrackingArea",
  "NSView",
  "NSWindow",
] }
# OS keychain (src/secrets): the login keychain via security-framework.
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
